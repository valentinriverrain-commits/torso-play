<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torso — Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Interface reprise du site Torso : fond blanc, grande carte grise arrondie, barre flottante translucide,
     onglets à 6 px de rayon, bouton d'action bleu à 10 px, Aeonik 13 px. */
  :root {
    --ink: #343433; --mute: #7E7E7C; --card: #CACAC8; --glass: rgba(227,227,225,.65); --seg: rgba(202,202,200,.5);
    --tab-on: rgba(126,126,124,.4); --blue: #0022B1; --orange: #D85700;
    --sans: Aeonik, "Aeonik Regular", Inter, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #fff; color: var(--ink); font: 13px var(--sans); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
  .logo svg { height: 26px; width: auto; display: block; }
  header .note { font-size: 13px; color: var(--mute); }

  #stage { position: fixed; top: 64px; left: 16px; right: 16px; bottom: 16px; border-radius: 20px; overflow: hidden;
    background: radial-gradient(110% 85% at 50% 42%, #D9D9D7 0%, #CACAC8 55%, #BDBDBB 100%); }
  #stage canvas { display: block; touch-action: none; }

  /* ── Barre flottante (comme la sous-navigation produit du site Torso) ── */
  .subnav { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    padding: 15px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2; }
  .mark { height: 35px; min-width: 52px; padding: 0 8px; display: grid; place-items: center; border: 1.6px solid var(--ink);
    border-radius: 8px; font-size: 20px; letter-spacing: -0.02em; }
  .seg { display: flex; gap: 5px; padding: 5px; border-radius: 12px; background: var(--seg); }
  .seg button { white-space: nowrap; padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); line-height: 15px; transition: background .2s; }
  .seg button:hover { background: rgba(126,126,124,.2); }
  .seg button.on { background: var(--tab-on); }
  .cta { height: 35px; padding: 0 16px; border-radius: 10px; background: var(--blue); color: #fff; font-size: 13px;
    display: flex; align-items: center; gap: 8px; transition: background .2s; }
  .cta i { width: 0; height: 0; border-left: 7px solid #fff; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
  .cta.on { background: var(--orange); }
  .cta.on i { border: 0; width: 8px; height: 8px; background: #fff; }

  /* ── Bas de la carte ── */
  .foot { position: absolute; left: 32px; right: 32px; bottom: 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; pointer-events: none; transition: opacity .35s; }
  .foot > * { pointer-events: auto; }
  .foot.fade { opacity: 0; }
  .eyebrow { font-size: 13px; color: var(--mute); }
  .pname { font-size: clamp(56px, 8.5vw, 120px); letter-spacing: -0.045em; line-height: .86; margin: 8px 0 16px -4px; }
  .readout { display: flex; align-items: baseline; gap: 10px; min-height: 20px; }
  .readout span { font: 11px var(--mono); color: var(--mute); letter-spacing: .06em; text-transform: uppercase; }
  .readout b { font-size: 17px; font-weight: 400; }
  .help { font-size: 13px; line-height: 1.45; color: var(--mute); max-width: 420px; margin-top: 6px; min-height: 19px; }
  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .controls .label { font-size: 13px; color: var(--mute); }
  .controls .seg button { display: flex; align-items: center; gap: 7px; }
  .controls .seg button i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .25; }
  .controls .seg button.hit i { background: var(--orange); opacity: 1; }
  .controls .seg button.muted { opacity: .45; text-decoration: line-through; }
  .hint { font-size: 12px; line-height: 1.6; color: var(--mute); text-align: right; }

  /* ── Fiche technique ── */
  .specs { position: absolute; top: 110px; right: 24px; width: min(380px, calc(100% - 48px)); padding: 20px; border-radius: 20px;
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2;
    opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .25s, transform .25s; max-height: calc(100% - 140px); overflow: auto; }
  .specs.open { opacity: 1; transform: none; pointer-events: auto; }
  .specs h3 { font-size: 20px; font-weight: 400; letter-spacing: -0.01em; margin-bottom: 14px; }
  .specs dl { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; }
  .specs dt { font: 11px var(--mono); color: var(--mute); letter-spacing: .05em; padding-top: 2px; }
  .specs dd { font-size: 13px; line-height: 1.4; }
  .specs .price { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(52,52,51,.15); display: flex; justify-content: space-between; font-size: 15px; }

  .tip { position: fixed; padding: 5px 9px; border-radius: 6px; background: var(--ink); color: #fff; font: 11px var(--mono);
    pointer-events: none; opacity: 0; transform: translate(-50%, -150%); transition: opacity .12s; white-space: nowrap; z-index: 5; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
  @media (max-width: 760px) {
    header { padding: 0 20px; } header .note { display: none; }
    #stage { left: 8px; right: 8px; bottom: 8px; }
    .subnav { top: 12px; padding: 10px; gap: 8px; } .mark, .seg.views { display: none; }
    .foot { left: 20px; right: 20px; bottom: 20px; flex-direction: column; align-items: flex-start; }
    .controls { align-items: flex-start; } .hint, .help { display: none; }
  }
</style>
</head>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t, 0, 1));
const easeInOut = t => (t = clamp(t, 0, 1), t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const lerp = (a, b, t) => a + (b - a) * t;

// ═══ Scène ══════════════════════════════════════════════════════════════════
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });   // transparent : le dégradé de la carte passe derrière
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(-0.6, 1.2, 0.8);
scene.add(keyLight);

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 0.45; controls.maxPolarAngle = Math.PI * 0.6;
controls.target.set(0, -0.03, 0);

const shadowTex = (() => {          // ombre douce sous la machine (elle flotte)
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), r = g.createRadialGradient(128, 128, 8, 128, 128, 128);
  r.addColorStop(0, "rgba(0,0,0,0.28)"); r.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();

const VIEW = new THREE.Vector3(0.42, 0.62, 1.0).normalize();
function fitDistance(inst) {        // recule la caméra pour que toute la machine tienne dans la carte
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  return Math.max(0.64 / Math.tan(hf), (0.34 + inst.depth * 0.6) / Math.tan(vf)) * 1.2;
}
function setDistance(d) {
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.copy(VIEW);
  camera.position.copy(controls.target).addScaledVector(dir.normalize(), d);
}
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  if (cur) { camTo = fitDistance(cur); controls.maxDistance = camTo * 1.8; if (swap >= 1) setDistance(camTo); }
}
addEventListener("resize", resize);

// ═══ Outils communs ════════════════════════════════════════════════════════
function loadGLB(b64, onLoad) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  new GLTFLoader().parse(bin.buffer, "", onLoad, err => { console.error(err); $("loading").textContent = "Couldn’t load the model — keep the .js files next to index.html."; });
}
function setupKnob(o, root, markColor = 0xffffff) {   // la molette tourne dans un groupe, avec un repère sur le dessus
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
  const holder = new THREE.Group(); o.parent.add(holder);
  holder.position.copy(o.position); holder.quaternion.copy(o.quaternion); holder.scale.copy(o.scale);
  holder.add(o); o.position.set(0, 0, 0); o.quaternion.identity(); o.scale.set(1, 1, 1);
  holder.updateMatrixWorld(true);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(size.x * 0.09, size.x * 0.01, size.x * 0.36), new THREE.MeshBasicMaterial({ color: markColor }));
  mark.position.copy(box.getCenter(new THREE.Vector3())).add(new THREE.Vector3(0, size.y / 2 + size.x * 0.004, -size.x * 0.2));
  scene.add(mark); holder.attach(mark);
  const axis = new THREE.Vector3(0, 1, 0).applyQuaternion(holder.getWorldQuaternion(new THREE.Quaternion()).invert());
  return { obj: holder, mesh: o, axis, angle: 0 };
}
function turn(k, v) {                // v ∈ [0, 1] → −135° … +135°
  const a = (clamp(v, 0, 1) - 0.5) * 1.5 * Math.PI;
  k.obj.rotateOnAxis(k.axis, -(a - k.angle)); k.angle = a;
}
function pressable(p, depth) {       // direction « vers le bas » dans le repère du parent
  const a = p.parent.worldToLocal(new THREE.Vector3(0, 0, 0)), b = p.parent.worldToLocal(new THREE.Vector3(0, -depth, 0));
  p.userData.down = b.sub(a); p.userData.home = p.position.clone(); p.userData.press = 0;
}
function pressPos(p, amount) { p.position.copy(p.userData.home).addScaledVector(p.userData.down, amount); }

function show(name, value, help) {
  $("r-name").textContent = name; $("r-val").textContent = value;
  if (help !== undefined) $("r-help").textContent = help;
}
const tip = $("tip");
function place(e, text) { tip.textContent = text; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.style.opacity = 1; }

// ═══ Son (Web Audio) ════════════════════════════════════════════════════════
let ac, master, verb, echo, DEST = null, SEND = 1;
function audio() {
  if (ac) return;
  ac = new AudioContext();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
  master = ac.createGain(); master.gain.value = 0.7;
  master.connect(comp); comp.connect(ac.destination);
  const conv = ac.createConvolver(), len = ac.sampleRate * 2.4, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
  conv.buffer = ir; verb = ac.createGain(); verb.gain.value = 0.22; verb.connect(conv); conv.connect(comp);
  const dl = ac.createDelay(2), fb = ac.createGain(), lp = ac.createBiquadFilter();
  dl.delayTime.value = 0.375; fb.gain.value = 0.32; lp.type = "lowpass"; lp.frequency.value = 2400;
  echo = ac.createGain(); echo.gain.value = 0.18; echo.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(comp);
  Object.assign(echo, { line: dl, fb, lp });
  S4.audioReady();
}
/* mobile : iOS ne débloque le son que dans un touchend/click (pas pointerdown) et coupe Web Audio en mode silencieux.
   Au premier geste : contexte créé et relancé, un échantillon muet joué, et une piste <audio> muette en boucle
   qui fait passer la page en lecture « média » (le son sort même avec le bouton silencieux activé). */
function unlockAudio() {
  audio();
  if (navigator.audioSession) try { navigator.audioSession.type = "playback"; } catch (e) {}
  ac.resume();
  const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
  if (!unlockAudio.el) {
    const n = 4410, buf = new DataView(new ArrayBuffer(44 + n * 2)), w = (o, t) => [...t].forEach((c, i) => buf.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); buf.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
    buf.setUint32(24, 44100, true); buf.setUint32(28, 88200, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); w(36, "data"); buf.setUint32(40, n * 2, true);
    const el = unlockAudio.el = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
    el.loop = true; el.setAttribute("playsinline", ""); el.play().catch(() => {});
  }
  if (ac.state === "running") ["touchend", "click", "keydown"].forEach(t => removeEventListener(t, unlockAudio, true));
}
["touchend", "click", "keydown"].forEach(t => addEventListener(t, unlockAudio, true));
const hz = m => 440 * 2 ** ((m - 69) / 12);
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function out(node, sends = 0.5) {    // DEST : entrée d'une piste du S-4 (ses effets) ; SEND : envois réverbe/écho de la T-1
  node.connect(DEST || master);
  if (sends * SEND) { const s = ac.createGain(); s.gain.value = sends * SEND; node.connect(s); s.connect(verb); s.connect(echo); }
}
function noise(dur) { const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const n = ac.createBufferSource(); n.buffer = b; return n; }
const VOICES = {
  kick(t, n, v) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(160 * 2 ** ((n - 57) / 24), t); o.frequency.exponentialRampToValueAtTime(45 * 2 ** ((n - 57) / 24), t + 0.12);
    env(g, t, 0.003, v, 0.45); o.connect(g); out(g, 0.05); o.start(t); o.stop(t + 0.5);
  },
  snare(t, n, v) {
    const s = noise(0.3), bp = ac.createBiquadFilter(), g = ac.createGain(), o = ac.createOscillator(), og = ac.createGain();
    bp.type = "bandpass"; bp.frequency.value = 1800 * 2 ** ((n - 60) / 24); bp.Q.value = 0.8; env(g, t, 0.002, v * 0.7, 0.22);
    o.frequency.setValueAtTime(220 * 2 ** ((n - 60) / 12), t); o.frequency.exponentialRampToValueAtTime(160, t + 0.1); env(og, t, 0.002, v * 0.5, 0.12);
    s.connect(bp); bp.connect(g); o.connect(og); out(g, 0.35); out(og, 0.2); s.start(t); o.start(t); o.stop(t + 0.2);
  },
  hat(t, n, v, dur) {
    const s = noise(0.2), hp = ac.createBiquadFilter(), g = ac.createGain();
    hp.type = "highpass"; hp.frequency.value = 7000 + (n - 60) * 40; env(g, t, 0.001, v * 0.35, Math.min(0.03 + dur * 0.4, 0.25));

// Pastilles en bas à droite : les 4 pistes de la machine affichée

function fade(inst, alpha) {   // opacité de toute la machine (matériaux passés en transparent pendant la transition)
  inst.holder.traverse(o => {
    if (!o.material) return;
    for (const m of [].concat(o.material)) {
      const u = m.userData;
      if (u.baseOpacity === undefined) { u.baseOpacity = m.opacity; u.baseTransparent = m.transparent; u.baseDepthWrite = m.depthWrite; }
      const tr = alpha < 0.999 || u.baseTransparent;
      if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }
      m.opacity = u.baseOpacity * alpha; m.depthWrite = u.baseDepthWrite && alpha > 0.5;
    }
  });
}

  [...$("switch").children].forEach(b => b.classList.toggle("on", b.dataset.id === id));

  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const h = ray.intersectObjects(cur.pickables(), false)[0];
  return h ? cur.classify(h.object) : null;
}
renderer.domElement.addEventListener("pointerdown", e => {
  const h = pick(e); if (!h) return;
  if (h.knob) { drag = { k: h.knob, y: e.clientY, d: cur.knobStart(h.knob) }; controls.enabled = false; renderer.domElement.setPointerCapture(e.pointerId); }
  else { audio(); ac.resume(); cur.down(h); }
});
renderer.domElement.addEventListener("pointermove", e => {
  if (drag) { place(e, cur.knobMove(drag.k, drag.d, drag.y - e.clientY)); return; }
  const h = pick(e);
  renderer.domElement.style.cursor = h ? "pointer" : "grab";
  if (h) place(e, cur.label(h)); else tip.style.opacity = 0;
});
renderer.domElement.addEventListener("pointerleave", () => (tip.style.opacity = 0));
addEventListener("pointerup", () => { if (drag) { drag = null; controls.enabled = true; } if (cur) cur.up(); });
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); return; }
  if (e.key === "Tab") { e.preventDefault(); switchTo(cur === T1 ? "s4" : "t1"); return; }
  if (cur) cur.key(e, true);
});
addEventListener("keyup", e => { if (cur) cur.key(e, false); });

// ═══ Boucle ═══════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (cur) {
    if (swap < 1) {   // l'ancienne machine glisse à gauche en s'effaçant, la nouvelle arrive de la droite en apparaissant
      swap = Math.min(1, swap + dt / 1.3);
      const kOut = easeInOut(swap / 0.65), kIn = easeInOut((swap - 0.3) / 0.7);
      setDistance(lerp(camFrom, camTo, easeInOut(swap)));
      if (prev) { prev.holder.position.x = -kOut * 0.9; prev.holder.rotation.y = kOut * 0.35; fade(prev, 1 - kOut); }
      cur.holder.position.x = (1 - kIn) * 0.9; cur.holder.rotation.y = -(1 - kIn) * 0.35; fade(cur, kIn);
      if (swap >= 1 && prev) { prev.holder.visible = false; prev.holder.position.x = 0; prev.holder.rotation.y = 0; fade(prev, 1); prev = null; fade(cur, 1); }
    }
    cur.holder.position.y = Math.sin(t * 1.2) * 0.006;
    cur.update(dt);
  }
  controls.update();
  renderer.render(scene, camera);
});
window.TORSO = { T1, S4, camera, controls, renderer, scene, pick, switchTo };   // pour le débogage dans la console
</script>
